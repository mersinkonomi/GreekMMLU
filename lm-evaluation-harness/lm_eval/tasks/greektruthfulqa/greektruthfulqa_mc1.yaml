tag:
  - greektruthfulqa
task: greektruthfulqa_mc1
dataset_path: ilsp/truthful_qa_greek
dataset_name: multiple_choice
output_type: generate_until
training_split: null
validation_split: train
test_split: null
num_fewshot: 0
process_docs: !function utils.process_docs_mc1
doc_to_text: !function utils.doc_to_text_mc1
doc_to_target: !function utils.doc_to_target_mc1
should_decontaminate: True
doc_to_decontamination_query: question
generation_kwargs:
  until:
    - "<|im_end|>"
    - "<|endoftext|>"
    - "<|eot_id|>"
    - "<|ifm|endoftext|>"
    - "</s>"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 64
filter_list:
  - name: boxed-extract
    filter:
      # mc1 has up to 13 choices, so Greek labels run Α..Ν. Latin A-M/a-m are
      # normalized positionally (A->Α, C->Γ, ... M->Ν), matching the greekmmlu
      # convention; lowercase Greek letters map to their uppercase label.
      - function: regex
        regex_pattern: '\\boxed\s*\{\s*([ΑΒΓΔΕΖΗΘΙΚΛΜΝαβγδεζηθικλμνABCDEFGHIJKLMabcdefghijklm])\s*[.)]?\s*\}'
        group_select: -1
        fallback: '[invalid]'
      - function: map
        mapping_dict:
          Α: Α
          Β: Β
          Γ: Γ
          Δ: Δ
          Ε: Ε
          Ζ: Ζ
          Η: Η
          Θ: Θ
          Ι: Ι
          Κ: Κ
          Λ: Λ
          Μ: Μ
          Ν: Ν
          α: Α
          β: Β
          γ: Γ
          δ: Δ
          ε: Ε
          ζ: Ζ
          η: Η
          θ: Θ
          ι: Ι
          κ: Κ
          λ: Λ
          μ: Μ
          ν: Ν
          A: Α
          B: Β
          C: Γ
          D: Δ
          E: Ε
          F: Ζ
          G: Η
          H: Θ
          I: Ι
          J: Κ
          K: Λ
          L: Μ
          M: Ν
          a: Α
          b: Β
          c: Γ
          d: Δ
          e: Ε
          f: Ζ
          g: Η
          h: Θ
          i: Ι
          j: Κ
          k: Λ
          l: Μ
          m: Ν
        default_value: '[invalid]'
      - function: take_first
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 3.0
